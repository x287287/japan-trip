# 讓 Supabase 免費專案不會因為「一週沒人用」被暫停：每 2 天自動戳一下資料庫。
# 不需要任何密碼；用的是網站本來就公開的金鑰（index.html 裡的 publishable key）。
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 3 */2 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          # 這張表要登入才能讀，所以會回「沒有權限」，但那代表資料庫有被叫醒，算成功。
          code=$(curl -sS -o body.txt -w "%{http_code}" \
            "https://jvzjpwcjrdyhsooyyxbv.supabase.co/rest/v1/site_content?select=id&limit=1" \
            -H "apikey: sb_publishable_vxDpLTQPoTnRMc1dgxDbag_X4jH0vqv")
          echo "HTTP $code"; cat body.txt; echo
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then exit 1; fi

<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>公埔國小日本交流行</title><meta name="robots" content="noindex,nofollow"><meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="app-css">
/* Layout: station-signage look. Sticky tab bar, day sections with a time rail, boarding-pass flight cards, tick-off checklist. */
/* Theme: warm washi paper, sumi ink, vermilion accent. */
:root {
  --bg: #F6EFE0; --surface: #FFFBF2; --ink: #3B2F28; --muted: #6F5F52; --line: #E2D5BE;
  --sign: #EDB02C; --sign-ink: #7F5200; --sign-soft: #FBEFC8; --on-sign: #3B2F28; --torii: #B8452F;
  --amber: #8A5410; --amber-soft: #F5E5C0;
  --ok: #4E7A3E; --bad: #A3322B; --bad-soft: #F7DAD3;
  --blossom: #F2B8C0; --sun: #F0B9A0; --moss: #9DB48B; --indigo: #3F5876;
  --font-sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-mono: "DM Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1713; --surface: #2A211B; --ink: #F1E6D4; --muted: #BBA996; --line: #4A3B30;
    --sign: #F0BE4A; --sign-ink: #F2C968; --sign-soft: #4A3A14; --on-sign: #2A1D08; --torii: #E58B78;
    --amber: #E8B466; --amber-soft: #43331A; --ok: #A5CC93; --bad: #F4A096; --bad-soft: #45211D;
    --blossom: #D98A99; --sun: #7A4A38; --moss: #5E7350; --indigo: #8FB0D6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1713; --surface: #2A211B; --ink: #F1E6D4; --muted: #BBA996; --line: #4A3B30;
  --sign: #F0BE4A; --sign-ink: #F2C968; --sign-soft: #4A3A14; --on-sign: #2A1D08; --torii: #E58B78;
  --amber: #E8B466; --amber-soft: #43331A; --ok: #A5CC93; --bad: #F4A096; --bad-soft: #45211D;
  --blossom: #D98A99; --sun: #7A4A38; --moss: #5E7350; --indigo: #8FB0D6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
.wrap { max-width: 880px; margin: 0 auto; }
a { color: var(--sign-ink); }
:focus-visible { outline: 3px solid var(--sign-ink); outline-offset: 2px; }

header.hero { padding: 36px 0 24px; display: grid; gap: 14px; }
.hero .org { font-size: 14px; letter-spacing: .08em; color: var(--muted); }
.hero h1 { font-size: clamp(30px, 6vw, 46px); line-height: 1.15; font-weight: 900; margin: 0; text-wrap: balance; }
.hero .meta { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-family: var(--font-mono); font-size: 14px; background: var(--sign-soft); color: var(--sign-ink); padding: 4px 12px; border-radius: 999px; }
.route { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-weight: 700; color: var(--ink); }
.route span.arr { color: var(--muted); font-weight: 400; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 2px solid var(--ink); }
nav.tabs { display: flex; gap: 4px; padding-top: 6px; overflow-x: auto; }
.daybar { display: flex; gap: 8px; padding: 10px 0; overflow-x: auto; border-top: 1px solid var(--line); }
.daybar a {
  flex: 1 0 auto; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  padding: 6px 14px; border-radius: 8px; font-size: 15px; line-height: 1.3; text-align: center; white-space: nowrap;
}
.daybar a b { font-family: var(--font-mono); font-weight: 500; font-size: 12px; color: var(--sign-ink); display: block; letter-spacing: .06em; }
.daybar a:hover { border-color: var(--sign); }
.daybar a[aria-current="true"] { background: var(--sign); color: var(--on-sign); border-color: var(--sign); }
.daybar a[aria-current="true"] b { color: var(--on-sign); }
.pager { display: flex; justify-content: space-between; gap: 12px; padding: 14px 18px; border-top: 1px solid var(--line); }
.pager a { text-decoration: none; font-weight: 700; padding: 8px 16px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); }
.pager a:hover { border-color: var(--sign); color: var(--sign-ink); }
.pager .sp { flex: 1; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
nav.tabs a {
  text-decoration: none; color: var(--muted); font-weight: 700; padding: 10px 16px; border-radius: 6px 6px 0 0; white-space: nowrap;
}
nav.tabs a:hover { color: var(--ink); }
nav.tabs a[aria-current="true"] { background: var(--ink); color: var(--bg); }

section.block { padding-top: 24px; }
article.day { margin-top: 20px; }
h2.sec { font-size: 26px; margin: 0 0 6px; font-weight: 900; }
p.lead { margin: 0 0 22px; color: var(--muted); max-width: 62ch; }

/* day jump */
.dayjump { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.dayjump a {
  text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  padding: 8px 14px; border-radius: 8px; font-size: 15px; line-height: 1.3;
}
.dayjump a b { font-family: var(--font-mono); color: var(--sign-ink); display: block; font-size: 13px; font-weight: 500; }
.dayjump a:hover { border-color: var(--sign); }

article.day { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 22px; overflow: hidden; scroll-margin-top: 64px; }
.day-head { display: flex; gap: 16px; align-items: stretch; background: var(--ink); color: var(--bg); }
.day-no { font-family: var(--font-mono); padding: 14px 18px; background: var(--sign); color: var(--on-sign); display: grid; place-items: center; text-align: center; line-height: 1.1; min-width: 78px; }
.day-no small { font-size: 12px; letter-spacing: .1em; display: block; opacity: .85; }
.day-no strong { font-size: 30px; font-weight: 500; }
.day-title { padding: 12px 16px 12px 0; min-width: 0; }
.day-title h3 { margin: 0; font-size: 20px; line-height: 1.3; }
.day-title p { margin: 2px 0 0; font-size: 14px; opacity: .8; }

ol.tl { list-style: none; margin: 0; padding: 8px 18px 4px; }
ol.tl li { display: grid; grid-template-columns: 112px 1fr; gap: 6px 16px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
ol.tl li:last-child { border-bottom: 0; }
.t { font-family: var(--font-mono); font-size: 14px; color: var(--sign-ink); padding-top: 2px; }
.what { min-width: 0; }
.what b { font-weight: 700; }
.what small { display: block; color: var(--muted); font-size: 14px; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; background: var(--sign-soft); color: var(--sign-ink); }
.tag.school { background: var(--amber-soft); color: var(--amber); }
.tag.fly { background: var(--ink); color: var(--bg); }
.tag.meal { background: var(--line); color: var(--ink); }

.day-foot { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 2px solid var(--ink); }
.day-foot > div { padding: 12px 18px; border-right: 1px solid var(--line); min-width: 0; }
.day-foot > div:last-child { border-right: 0; }
.day-foot h4 { margin: 0 0 4px; font-size: 13px; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.day-foot p { margin: 0; font-size: 14px; line-height: 1.5; }
.day-foot .yen { font-family: var(--font-mono); color: var(--amber); font-size: 13px; }
.stay { grid-column: 1 / -1; border-top: 1px solid var(--line); border-right: 0 !important; background: var(--sign-soft); }
.stay h4 { color: var(--sign-ink); }

/* flights */
.passes { display: grid; gap: 20px; }
.pass { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: grid; grid-template-columns: minmax(0, 1fr) 170px; overflow: hidden; }
.pass-main { padding: 20px 22px; min-width: 0; }
.pass-top { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; font-size: 14px; color: var(--muted); }
.pass-top b { color: var(--ink); }
.legs { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; margin: 16px 0 12px; }
.leg .code { font-family: var(--font-mono); font-size: 40px; line-height: 1; font-weight: 500; }
.leg .city { font-weight: 700; }
.leg .time { font-family: var(--font-mono); font-size: 28px; color: var(--sign-ink); line-height: 1.2; }
.leg.r { text-align: right; }
.path { height: 2px; background: repeating-linear-gradient(90deg, var(--muted) 0 6px, transparent 6px 12px); position: relative; min-width: 40px; }
.path::after { content: "✈"; position: absolute; left: 50%; top: -13px; transform: translateX(-50%); background: var(--surface); padding: 0 6px; color: var(--sign-ink); font-size: 20px; }
.pass-note { font-size: 14px; color: var(--muted); margin: 0; }
.stub { border-left: 2px dashed var(--line); padding: 20px 18px; background: var(--sign-soft); display: grid; gap: 4px; align-content: center; }
.stub .lab { font-size: 12px; letter-spacing: .1em; color: var(--sign-ink); font-weight: 700; }
.stub .val { font-family: var(--font-mono); font-size: 20px; }
.flight-tips { margin-top: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 22px; }
.flight-tips h3 { margin: 0 0 8px; font-size: 18px; }
.flight-tips ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.contact { margin-top: 18px; padding: 16px 22px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.contact h3 { margin: 0 0 6px; font-size: 18px; }
.contact p { margin: 0; font-family: var(--font-mono); font-size: 15px; display: flex; flex-wrap: wrap; gap: 4px 20px; }

/* checklist */
.progress { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 52px); z-index: 10; background: var(--bg); padding: 10px 0; display: grid; gap: 6px; }
.progress .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.progress .count { font-weight: 700; }
.bar { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .25s; }
button.ghost { font: inherit; font-size: 14px; background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 6px 14px; border-radius: 8px; cursor: pointer; }
button.ghost:hover { border-color: var(--sign); }
button.ghost.armed { background: var(--amber-soft); color: var(--amber); border-color: var(--amber); }
.groups { display: grid; gap: 18px; margin-top: 8px; }
.ctabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 16px; }
.ctabs button {
  font: inherit; font-weight: 700; font-size: 15px; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); padding: 8px 16px; border-radius: 999px; cursor: pointer; font-variant-numeric: tabular-nums;
}
.ctabs button:hover { border-color: var(--sign); }
.ctabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cpanel { display: grid; gap: 16px; }
.rule { border-radius: 12px; padding: 14px 18px 8px; border: 1px solid var(--line); border-left-width: 8px; background: var(--surface); }
.rule h3 { margin: 0 0 6px; font-size: 18px; line-height: 1.35; }
.rule ul { list-style: none; margin: 0; padding: 0; }
.rule li { display: grid; gap: 0; padding: 8px 0; border-top: 1px dashed var(--line); }
.rule li:first-child { border-top: 0; }
.rule li b { font-weight: 700; }
.rule li span { color: var(--muted); font-size: 14px; line-height: 1.5; }
.rule.sign { border-left-color: var(--sign); background: var(--sign-soft); }
.rule.sign h3 { color: var(--sign-ink); }
.rule.amber { border-left-color: var(--amber); background: var(--amber-soft); }
.rule.amber h3 { color: var(--amber); }
.rule.bad { border-left-color: var(--bad); background: var(--bad-soft); }
.rule.bad h3 { color: var(--bad); }
.rule li { border-top-color: color-mix(in srgb, var(--ink) 18%, transparent); }
.rule li span { color: var(--ink); opacity: .78; }
.vctl { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 14px; color: var(--muted); font-size: 14px; }
.vctl[hidden] { display: none; }
button.ghost[aria-pressed="true"] { background: var(--sign); color: var(--on-sign); border-color: var(--sign); }
button.say { font: inherit; color: inherit; background: transparent; border: 0; padding: 4px 0; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; border-radius: 6px; }
button.say svg { flex: none; color: var(--sign-ink); }
button.say:disabled { cursor: default; }
button.say.ja { font-size: 22px; font-weight: 700; line-height: 1.4; }
button.say.en { font-size: 16px; padding-top: 6px; margin-top: 6px; border-top: 1px dashed var(--line); border-radius: 0; }
button.say.en i { font-style: normal; font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); margin-right: 8px; }
button.say:hover:not(:disabled) svg { color: var(--ink); }
button.say.playing { color: var(--sign-ink); }
button.say.playing svg { animation: pulse .9s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { button.say.playing svg { animation: none; } }
fieldset.group { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 4px 18px 8px; margin: 0; min-width: 0; }
fieldset.group legend { font-weight: 900; font-size: 18px; padding: 0 8px; margin-left: -8px; }
.item { display: grid; grid-template-columns: 26px 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px dashed var(--line); cursor: pointer; align-items: start; }
.item:last-child { border-bottom: 0; }
.item input { appearance: none; width: 24px; height: 24px; border: 2px solid var(--muted); border-radius: 6px; margin: 1px 0 0; display: grid; place-content: center; background: var(--surface); cursor: pointer; }
.item input:checked { background: var(--ok); border-color: var(--ok); }
.item input:checked::after { content: ""; width: 6px; height: 12px; border: solid var(--on-sign); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); }
.item .name { font-weight: 500; }
.item small { display: block; color: var(--muted); font-size: 14px; line-height: 1.45; }
.item input:checked ~ span .name { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted); }
.warn { color: var(--amber); font-weight: 700; }

/* phrases */
.cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.cats button {
  font: inherit; font-weight: 700; font-size: 15px; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); padding: 8px 16px; border-radius: 999px; cursor: pointer;
}
.cats button:hover { border-color: var(--sign); }
.cats button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.plist { display: grid; gap: 12px; }
.phrase { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; display: grid; gap: 2px; min-width: 0; }
.phrase .zh { font-size: 14px; color: var(--muted); font-weight: 700; }
.phrase .ja { font-size: 22px; font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
.phrase .ro { font-family: var(--font-mono); font-size: 14px; color: var(--sign-ink); overflow-wrap: anywhere; }
.phrase .en { font-size: 16px; padding-top: 6px; margin-top: 6px; border-top: 1px dashed var(--line); }
.phrase .en i { font-style: normal; font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); margin-right: 8px; }
.pnote { background: var(--amber-soft); color: var(--ink); border-radius: 12px; padding: 14px 18px; font-weight: 500; }
.pnote b { color: var(--amber); }

footer { margin-top: 48px; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }

@media (max-width: 640px) {
  ol.tl li { grid-template-columns: 1fr; gap: 0; }
  .day-foot { grid-template-columns: 1fr; }
  .day-foot > div { border-right: 0; border-bottom: 1px solid var(--line); }
  .pass { grid-template-columns: minmax(0, 1fr); }
  .stub { border-left: 0; border-top: 2px dashed var(--line); grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .leg .code { font-size: 30px; }
  .leg .time { font-size: 22px; }
  .day-no { min-width: 64px; padding: 12px; }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } html { scroll-behavior: auto; } }
html { scroll-behavior: smooth; }

/* spots */
.spnav { display: grid; gap: 10px; margin-bottom: 20px; }
.sp-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sp-day { font-family: var(--font-mono); font-size: 13px; color: var(--sign-ink); font-weight: 500; min-width: 54px; letter-spacing: .06em; }
.sp-row button {
  font: inherit; font-weight: 700; font-size: 15px; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); padding: 7px 14px; border-radius: 999px; cursor: pointer; text-align: left;
}
.sp-row button:hover { border-color: var(--sign); }
.sp-row button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.spot { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.sp-head { padding: 18px 20px 14px; background: var(--ink); color: var(--bg); display: grid; gap: 8px; }
.sp-head h3 { margin: 0; font-size: 26px; line-height: 1.25; text-wrap: balance; }
.sp-tags { display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; }
.sp-tags span { background: var(--sign); color: var(--on-sign); padding: 2px 12px; border-radius: 999px; font-family: var(--font-mono); font-size: 13px; }
.sp-tags span.t { background: transparent; border: 1px solid currentColor; color: var(--bg); font-family: var(--font-sans); }
.sp-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); border-bottom: 2px solid var(--ink); }
.sp-info > div { padding: 12px 20px; border-right: 1px solid var(--line); min-width: 0; }
.sp-info > div:last-child { border-right: 0; }
.sp-info h4 { margin: 0 0 2px; font-size: 13px; letter-spacing: .08em; color: var(--muted); }
.sp-info p { margin: 0; font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; }
.sp-intro { padding: 18px 20px 4px; margin: 0; font-size: 17px; max-width: 65ch; }
.sp-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; padding: 16px 20px 20px; }
.sp-card { border: 1px solid var(--line); border-top: 6px solid var(--sign); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.sp-card.warn { border-top-color: var(--amber); background: var(--amber-soft); }
.sp-card h4 { margin: 0 0 6px; font-size: 17px; }
.sp-card.warn h4 { color: var(--amber); }
.sp-card ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 15px; }
@media (max-width: 640px) { .sp-info > div { border-right: 0; border-bottom: 1px solid var(--line); } }

.gwrap { display: grid; gap: 16px; }
.gcard { background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--sign); border-radius: 12px; padding: 14px 20px 8px; }
.gcard h3 { margin: 0 0 6px; font-size: 19px; }
.gcard ul { list-style: none; margin: 0; padding: 0; }
.gcard li { display: grid; gap: 0; padding: 9px 0; border-top: 1px dashed var(--line); }
.gcard li:first-child { border-top: 0; }
.gcard li span { color: var(--muted); font-size: 15px; line-height: 1.55; }

/* admin (後台) */
.adminlink { color: var(--muted); font-size: 13px; margin-left: 12px; }
button.primary { font: inherit; font-weight: 700; background: var(--sign); color: var(--on-sign); border: 1px solid var(--sign); padding: 8px 18px; border-radius: 8px; cursor: pointer; }
button.primary:hover { filter: brightness(1.1); }
.adm-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 2px solid var(--ink); padding: 12px 0; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.adm-bar h2 { margin: 0; font-size: 22px; }
.adm-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.adm-status { font-size: 14px; color: var(--muted); }
.adm-status.dirty { color: var(--amber); font-weight: 700; }
.adm-msg { min-height: 24px; margin: 10px 0 0; font-size: 15px; color: var(--ink); }
.adm-body { display: grid; gap: 16px; margin-top: 8px; }

function score(v, lang) {
  var l = String(v.lang).replace("_", "-").toLowerCase(), n = v.name || "", s = 0;
  if (l.indexOf(lang.slice(0, 2)) !== 0) return -1;
  if (l === lang.toLowerCase()) s += 4;
  if (GOOD.test(n)) s += 6;
  if (/natural|neural|premium|enhanced|online/i.test(n)) s += 4;
  if (BAD.test(n)) s -= 10;

  return s;
}
function ranked(lang) {

function voiceFor(lang) {

  else note.hidden = true;

function renderLogin() {
  var b = $("lgbox"), h = "<h1>公埔國小日本交流行</h1>";
  var note = authNote ? '<p class="lgnote" role="status">' + esc(authNote) + "</p>" : "";
  var err = '<p class="lgerr" id="lgerr" role="alert" aria-live="polite">' + esc(authErr) + "</p>";
  if (mode === "loading") h += '<p class="lead">載入中…</p>';
  else if (mode === "login") h += '<p class="lead">請用學校核准的帳號登入。</p>' + note + '<form id="lgform">' + lf("Email", "lge", "email", "username") + lf("密碼", "lgp", "password", "current-password") + '<button class="primary" type="submit">登入</button>' + err + '</form><p class="lgsw"><button class="linkbtn" data-go="signup" type="button">申請新帳號</button><button class="linkbtn" data-go="forgot" type="button">忘記密碼</button></p>';
  else if (mode === "signup") h += '<p class="lead">填寫後送出申請，管理員核准後才能看到內容。</p><form id="lgform">' + lf("你的名稱（例：王小明家長／三年二班）", "lgn", "text", "name") + lf("Email", "lge", "email", "email") + lf("密碼（至少 8 個字）", "lgp", "password", "new-password", 'minlength="8"') + '<button class="primary" type="submit">送出申請</button>' + err + '</form><p class="lgsw"><button class="linkbtn" data-go="login" type="button">回到登入</button></p>';
  else if (mode === "forgot") h += '<p class="lead">輸入 Email，我們會寄重設密碼的連結給你。</p><form id="lgform">' + lf("Email", "lge", "email", "email") + '<button class="primary" type="submit">寄出重設連結</button>' + err + '</form><p class="lgsw"><button class="linkbtn" data-go="login" type="button">回到登入</button></p>';
  else if (mode === "recovery") h += '<p class="lead">請設定新的密碼。</p><form id="lgform">' + lf("新密碼（至少 8 個字）", "lgp", "password", "new-password", 'minlength="8"') + '<button class="primary" type="submit">更新密碼</button>' + err + "</form>";
  else if (mode === "notice") h += '<p class="lead">' + esc(authNote) + '</p><p class="lgsw"><button class="linkbtn" data-go="login" type="button">回到登入</button></p>';
  else if (mode === "pending") h += '<p class="lead">你的帳號（' + esc(pendingEmail) + '）還沒有通過核准。管理員核准後，就能看到行程內容。</p><p class="lgsw"><button class="primary" id="lgre" type="button">重新檢查</button><button class="linkbtn" id="lgout" type="button">登出</button></p>';
  else if (mode === "error") h += '<p class="lgerr">' + esc(authErr) + '</p><p class="lgsw"><button class="primary" id="lgre" type="button">重試</button><button class="linkbtn" id="lgout" type="button">登出</button></p>';
  b.innerHTML = h;
  [].forEach.call(b.querySelectorAll("[data-go]"), function (x) { x.addEventListener("click", function () { authErr = ""; authNote = ""; setMode(x.dataset.go); }); });
  var f = $("lgform"); if (f) f.addEventListener("submit", onAuthSubmit);
  var re = $("lgre"); if (re) re.addEventListener("click", function () { loadApp(); });
  var lo = $("lgout"); if (lo) lo.addEventListener("click", logout);
}
function onAuthSubmit(ev) {
  ev.preventDefault();
  var btn = ev.target.querySelector("button[type=submit]"); btn.disabled = true; authErr = "";
  var done = function (msgText) { btn.disabled = false; if (msgText) { authErr = msgText; $("lgerr").textContent = msgText; } };
  var v = function (id) { var x = $(id); return x ? x.value : ""; };
  if (mode === "login") {
    sb.auth.signInWithPassword({ email: v("lge").trim(), password: v("lgp") }).then(function (r) {
      if (r.error) return done(/confirm/i.test(r.error.message) ? "這個 Email 還沒完成確認，請先點確認信中的連結。" : "Email 或密碼不正確。");
      loadApp();
    }, function () { done("連線失敗，請稍後再試。"); });
  } else if (mode === "signup") {
    sb.auth.signUp({ email: v("lge").trim(), password: v("lgp"), options: { data: { name: v("lgn").trim() }, emailRedirectTo: location.origin + location.pathname } }).then(function (r) {
      if (r.error) return done("申請失敗：" + r.error.message);
      if (r.data && r.data.session) { loadApp(); return; }
      authNote = "已送出申請。請到信箱點確認信中的連結（可能在垃圾郵件），之後等待管理員核准。"; setMode("notice");
    }, function () { done("連線失敗，請稍後再試。"); });
  } else if (mode === "forgot") {
    sb.auth.resetPasswordForEmail(v("lge").trim(), { redirectTo: location.origin + location.pathname }).then(function (r) {
      if (r.error) return done("寄送失敗：" + r.error.message);
      authNote = "如果這個 Email 有帳號，重設密碼的信已寄出。"; setMode("notice");
    }, function () { done("連線失敗，請稍後再試。"); });
  } else if (mode === "recovery") {
    sb.auth.updateUser({ password: v("lgp") }).then(function (r) {
      if (r.error) return done("更新失敗：" + r.error.message);
      recovery = false; loadApp();
    }, function () { done("連線失敗，請稍後再試。"); });
  }
}
function logout() {
  try { sessionStorage.removeItem(STASH); } catch (e) {}
  var go = function () { location.hash = ""; location.reload(); };
  if (sb) sb.auth.signOut().then(go, go); else go();
}
$("logout").addEventListener("click", logout);
async function loadApp() {
  try {
    var s = await sb.auth.getSession();
    var sess = s && s.data && s.data.session;
    if (recovery) { setMode("recovery"); return; }
    if (!sess) { authErr = ""; setMode("login"); return; }
    var p = await sb.from("profiles").select("*").eq("id", sess.user.id).maybeSingle();
    if (p.error) { authErr = "讀取帳號失敗：" + p.error.message; setMode("error"); return; }
    ME = p.data;
    pendingEmail = sess.user.email || "";
    if (!ME || !ME.approved) { setMode("pending"); return; }
    var c = await sb.from("site_content").select("data").eq("id", 1).maybeSingle();
    if (c.error || !c.data) { authErr = "讀取網站內容失敗" + (c.error ? "：" + c.error.message : "（尚未匯入內容）"); setMode("error"); return; }
    DATA = c.data.data; restoreStash(); renderSite(); applyAuth(); setLock(false); show();
  } catch (e) { authErr = "發生錯誤，請重新整理頁面。"; setMode("error"); }
}
function startAuth() {
  setLock(true); renderLogin();
  if (!window.supabase || !CFG.url || !CFG.key) { authErr = "系統設定不完整（缺少資料庫連線）。"; setMode("error"); return; }
  sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  sb.auth.onAuthStateChange(function (ev) {
    if (ev === "PASSWORD_RECOVERY") { recovery = true; setTimeout(function () { setMode("recovery"); }, 0); }
  });
  loadApp();
}

/* ---------- go ---------- */
startAuth();
})();
</script>
</body></html>

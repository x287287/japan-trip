  <div class="annbar" id="annbar" hidden></div>

  <section class="block page" id="home"></section>

  <div id="days"></div>

  <section class="block page" id="flights" hidden></section>

  <section class="block page" id="checklist" hidden>
    <h2 class="sec">攜帶物品檢核</h2>
    <p class="lead">勾選結果只存在這支手機或這台電腦的瀏覽器，不會傳給別人。換裝置需要重新勾選。</p>

    <h2 class="sec">常用會話</h2>
    <p class="lead">日文與英文對照。日本人多半聽得懂簡單英文，但說日文會更親切。句中的 ○○ 換成你要說的詞。</p>
